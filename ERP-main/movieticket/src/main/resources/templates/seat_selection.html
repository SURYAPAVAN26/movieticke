<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::body})}">
<head><title>Choose seats - CineSphere</title></head>
<body>
  <div class="theater-container">
    <div class="screen-container">
      <div class="virtual-screen"></div>
      <div class="screen-label">Screen this way</div>

      <div class="seat-grid">
        <div th:each="seat : ${seats}">
          <button type="button" 
                  th:attr="data-id=${seat.id}"
                  th:text="${seat.seatNumber}"
                  th:classappend="${seat.booked}? 'seat booked' : 'seat available'"
                  th:disabled="${seat.booked} ? true : false"
                  onclick="toggleSeat(this)"></button>
        </div>
      </div>

      <div class="legend">
        <div class="legend-item">
          <div class="legend-color available"></div>
          <span>Available</span>
        </div>
        <div class="legend-item">
          <div class="legend-color selected"></div>
          <span>Selected</span>
        </div>
        <div class="legend-item">
          <div class="legend-color booked"></div>
          <span>Reserved</span>
        </div>
      </div>
    </div>

    <div class="booking-panel">
      <h3>Booking Summary</h3>
      
      <!-- Error notification if redirected due to invalid booking -->
      <div th:if="${param.error}" style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); padding: 12px; border-radius: var(--border-radius-sm); color: var(--danger); font-size: 14px; display: flex; align-items: center; gap: 8px;">
        <span>⚠️</span> <span th:text="${param.error}">Error message</span>
      </div>

      <div class="booking-summary-row">
        <span>Movie:</span>
        <strong th:text="${show.movie.title}">Movie</strong>
      </div>
      <div class="booking-summary-row">
        <span>Theater:</span>
        <span th:text="${show.theater.name}">Theater</span>
      </div>
      <div class="booking-summary-row">
        <span>Showtime:</span>
        <span th:text="${#temporals.format(show.showTime,'dd MMM yyyy HH:mm')}">Time</span>
      </div>
      <div class="booking-summary-row">
        <span>Price per seat:</span>
        <span style="font-weight: 600; color: var(--success);">₹<span id="seatPrice" th:text="${show.price}"></span></span>
      </div>

      <div style="border-top: 1px solid var(--glass-border); padding-top: 16px; margin-top: 8px; display: flex; flex-direction: column; gap: 12px;">
        <div class="booking-summary-row">
          <span>Selected seats:</span>
          <strong id="selectedCount">0</strong>
        </div>
        <div class="booking-summary-row">
          <span>Total Price:</span>
          <strong style="color: var(--success); font-size: 22px;">₹<span id="totalPrice">0</span></strong>
        </div>
      </div>

      <form method="post" th:action="@{/bookings/create}" id="bookingForm">
        <input type="hidden" name="showId" th:value="${show.id}" />
        <input type="hidden" id="seatIds" name="seatIds" />
        <button type="submit" class="btn" onclick="prepareBooking(event)">Confirm & Pay</button>
      </form>
    </div>
  </div>
  <script th:src="@{/js/seats.js}"></script>
</body>
</html>
