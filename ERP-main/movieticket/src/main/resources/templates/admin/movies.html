<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::body})}">
<head><title>Admin - Movies</title></head>
<body>
  <h2>Manage Movies</h2>
  <a th:href="@{/admin/movies/new}" class="btn">Add Movie</a>
  <table class="table">
    <thead><tr><th>ID</th><th>Title</th><th>Genre</th><th>Actions</th></tr></thead>
    <tbody>
      <tr th:each="m: ${movies}">
        <td th:text="${m.id}"></td>
        <td th:text="${m.title}"></td>
        <td th:text="${m.genre}"></td>
        <td>
          <a th:href="@{/admin/movies/edit/{id}(id=${m.id})}" class="btn">Edit</a>
          <form th:action="@{/admin/movies/delete}" method="post" style="display:inline">
            <input type="hidden" name="id" th:value="${m.id}" />
            <button type="submit" class="btn danger">Delete</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>
</body>
</html>
